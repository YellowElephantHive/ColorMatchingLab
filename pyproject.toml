[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "color-matching-lab"
version = "0.1.0"
description = "Reproducible textile color matching experiments and an offline interactive showcase"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "scikit-image>=0.25,<1", "joblib>=1.4,<2", "py7zr>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
colorlab = "colorlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colorlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
